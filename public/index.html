<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酷安 Web</title>
<link rel="icon" href="logo.ico">
<!-- 每次进入随机主题色，首屏前应用，避免闪色 -->
<script>
  (function () {
    var themes = ['green', 'blue', 'purple', 'teal', 'orange', 'pink'];
    document.documentElement.setAttribute('data-theme', themes[Math.floor(Math.random() * themes.length)]);
  })();
</script>
<link rel="stylesheet" href="style.css?v=44">
</head>
<body>
<div class="bg-blob blob-a"></div>
<div class="bg-blob blob-b"></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="logo.ico" alt="酷安">
      <span>酷安 <em>Web</em></span>
    </div>
    <nav id="tabs">
      <button data-tab="main" class="active"><i>🏠</i>首页</button>
      <button data-tab="headline"><i>📰</i>头条</button>
      <button data-tab="topic"><i>#️⃣</i>话题</button>
      <button data-tab="picture"><i>🖼️</i>酷图</button>
      <button data-tab="digital"><i>💻</i>数码</button>
      <button data-tab="apk"><i>📱</i>应用</button>
    </nav>
    <div class="sidebar-foot">
    <button id="account-btn" title="账号设置">
      <span class="avatar-wrap">
        <img id="account-avatar" alt="" hidden>
        <span id="account-avatar-fallback">👤</span>
      </span>
      <span class="account-info">
        <span id="account-name">账号设置</span>
        <span class="account-desc">仅用于学习和研究</span>
      </span>
    </button>
  </div>
  </aside>

  <!-- 中栏：动态列表 -->
  <section class="col" id="list-col">
    <div id="toolbar" hidden>
      <button id="btn-back" title="返回话题列表">←</button>
      <div class="tb-title" id="toolbar-title"></div>
      <div class="tb-group">
        <button data-sort="dateline_desc" class="tb-sort active">最新动态</button>
        <button data-sort="popular" class="tb-sort">热门动态</button>
      </div>
      <button id="btn-refresh" title="刷新">⟳ 刷新</button>
    </div>
    <!-- 酷图：分类 + 搜索 -->
    <div id="pic-bar" class="list-bar" hidden>
      <div class="chip-row" id="pic-cats"></div>
      <div class="bar-search">
        <input id="pic-search-input" type="text" placeholder="搜索酷图标签（如：壁纸）">
        <button id="pic-search-btn">搜索</button>
      </div>
    </div>

    <!-- 数码：分类（可左右滑）+ 排序 -->
    <div id="digital-bar" class="list-bar" hidden>
      <div class="cat-scroll">
        <button class="cat-nav" id="digital-prev" title="向左">‹</button>
        <div class="chip-row" id="digital-cats"></div>
        <button class="cat-nav" id="digital-next" title="向右">›</button>
      </div>
      <div class="sort-row" id="digital-sorts">
        <button class="sort-btn active" data-sort="hot_num">热度</button>
        <button class="sort-btn" data-sort="release_time">最新</button>
      </div>
    </div>

    <!-- 应用：搜索 -->
    <div id="apk-bar" class="list-bar" hidden>
      <div class="bar-search">
        <input id="apk-search-input" type="text" placeholder="搜索应用（名称或包名）">
        <button id="apk-search-btn">搜索</button>
      </div>
    </div>

    <div id="topic-search" hidden>
      <input id="topic-search-input" type="text" placeholder="搜索全部话题（如：摄影、原神）">
      <button id="topic-search-btn">搜索</button>
    </div>
    <div id="pinned-topics"></div>
    <div id="pinned-apks"></div>
    <main id="content"></main>
    <div id="status" class="status" hidden></div>
    <!-- 返回顶部：贴在动态列表右下角（sticky 在列表栏内，不随内容滚走） -->
    <div id="backtop-wrap">
      <button id="backtop" title="返回顶部" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- 右栏：动态详情 + 评论（默认显示占位） -->
  <aside class="col" id="detail-col">
    <div id="detail-topbar">
      <button id="detail-close" title="关闭">×</button>
    </div>
    <div id="detail-content"></div>
  </aside>
</div>

<!-- 整个页面右上角：主题色切换（固定在视口，不属于任何一栏） -->
<div id="theme-dock">
  <div id="theme-picker">
    <button id="theme-btn" type="button" title="切换主题色" aria-label="切换主题色" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a9 9 0 1 0 0 18h1.4a1.75 1.75 0 0 0 0-3.5h-.8a1.75 1.75 0 0 1 0-3.5h4.1A4.3 4.3 0 0 0 21 9.7C20.6 5.9 16.7 3 12 3Z"/>
        <circle cx="7.5" cy="11.4" r="1.05" fill="currentColor" stroke="none"/>
        <circle cx="9.7" cy="7.7" r="1.05" fill="currentColor" stroke="none"/>
        <circle cx="14.1" cy="7" r="1.05" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <div id="theme-menu" hidden>
      <div class="theme-menu-head"><span>主题色</span><b id="theme-name">酷安绿</b></div>
      <div class="theme-swatches">
        <button type="button" class="theme-swatch" data-theme="green" style="--sw:#00a76e" title="酷安绿" aria-label="酷安绿"></button>
        <button type="button" class="theme-swatch" data-theme="blue" style="--sw:#2f7ff0" title="晴空蓝" aria-label="晴空蓝"></button>
        <button type="button" class="theme-swatch" data-theme="purple" style="--sw:#7c5cff" title="星河紫" aria-label="星河紫"></button>
        <button type="button" class="theme-swatch" data-theme="teal" style="--sw:#0ea5a5" title="松石青" aria-label="松石青"></button>
        <button type="button" class="theme-swatch" data-theme="orange" style="--sw:#f0862c" title="落日橙" aria-label="落日橙"></button>
        <button type="button" class="theme-swatch" data-theme="pink" style="--sw:#e8558e" title="樱花粉" aria-label="樱花粉"></button>
        <button type="button" class="theme-swatch theme-swatch-dark" data-theme="dark" style="--sw:#2b303a" title="暗黑" aria-label="暗黑主题">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          <span>暗黑</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 图片灯箱预览 -->
<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-mask"></div>
  <button id="lightbox-close" title="关闭">×</button>
  <button id="lightbox-prev" title="上一张" hidden>‹</button>
  <button id="lightbox-next" title="下一张" hidden>›</button>
  <div id="lightbox-counter" hidden></div>
  <img id="lightbox-img" alt="预览">
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-mask" onclick="closeModal()"></div>
  <div class="modal-body">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="app.js?v=48"></script>
</body>
</html>
