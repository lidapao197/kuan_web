<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酷安 Web</title>
<link rel="icon" href="logo.ico">
<!-- 每次进入随机主题色，首屏前应用，避免闪色 -->
<script>
  (function () {
    var themes = ['green', 'blue', 'purple', 'teal', 'orange', 'pink'];
    document.documentElement.setAttribute('data-theme', themes[Math.floor(Math.random() * themes.length)]);
  })();
</script>
<link rel="stylesheet" href="style.css?v=49">
</head>
<body>
<div class="bg-blob blob-a"></div>
<div class="bg-blob blob-b"></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="logo.ico" alt="酷安">
      <span>酷安 <em>Web</em></span>
    </div>
    <nav id="tabs">
      <button data-tab="main" class="active"><i>🏠</i>首页</button>
      <button data-tab="headline"><i>📰</i>头条</button>
      <button data-tab="topic"><i>#️⃣</i>话题</button>
      <button data-tab="picture"><i>🖼️</i>酷图</button>
      <button data-tab="digital"><i>💻</i>数码</button>
      <button data-tab="apk"><i>📱</i>应用</button>
    </nav>
    <div class="sidebar-foot">
    <button id="settings-btn" class="side-btn" title="设置">⚙️ 设置</button>
    <button id="account-btn" title="账号设置">
      <span class="avatar-wrap">
        <img id="account-avatar" alt="" hidden>
        <span id="account-avatar-fallback">👤</span>
      </span>
      <span class="account-info">
        <span id="account-name">账号设置</span>
        <span class="account-desc">仅用于学习和研究</span>
      </span>
    </button>
  </div>
  </aside>

  <!-- 中栏：动态列表 -->
  <section class="col" id="list-col">
    <div id="toolbar" hidden>
      <button id="btn-back" title="返回话题列表">←</button>
      <div class="tb-title" id="toolbar-title"></div>
      <div class="tb-group">
        <button data-sort="dateline_desc" class="tb-sort active">最新动态</button>
        <button data-sort="popular" class="tb-sort">热门动态</button>
      </div>
      <button id="btn-refresh" title="刷新">⟳ 刷新</button>
    </div>
    <!-- 酷图：分类 + 搜索 -->
    <div id="pic-bar" class="list-bar" hidden>
      <div class="chip-row" id="pic-cats"></div>
      <div class="bar-search">
        <input id="pic-search-input" type="text" placeholder="搜索酷图标签（如：壁纸）">
        <button id="pic-search-btn">搜索</button>
      </div>
    </div>

    <!-- 数码：分类（可左右滑）+ 排序 -->
    <div id="digital-bar" class="list-bar" hidden>
      <div class="cat-scroll">
        <button class="cat-nav" id="digital-prev" title="向左">‹</button>
        <div class="chip-row" id="digital-cats"></div>
        <button class="cat-nav" id="digital-next" title="向右">›</button>
      </div>
      <div class="sort-row" id="digital-sorts">
        <button class="sort-btn active" data-sort="hot_num">热度</button>
        <button class="sort-btn" data-sort="release_time">最新</button>
      </div>
    </div>

    <!-- 应用：搜索 -->
    <div id="apk-bar" class="list-bar" hidden>
      <div class="bar-search">
        <input id="apk-search-input" type="text" placeholder="搜索应用（名称或包名）">
        <button id="apk-search-btn">搜索</button>
      </div>
    </div>

    <div id="topic-search" hidden>
      <input id="topic-search-input" type="text" placeholder="搜索全部话题（如：摄影、原神）">
      <button id="topic-search-btn">搜索</button>
    </div>
    <div id="pinned-topics"></div>
    <div id="pinned-apks"></div>
    <main id="content"></main>
    <div id="status" class="status" hidden></div>
    <!-- 返回顶部：贴在动态列表右下角（sticky 在列表栏内，不随内容滚走） -->
    <div id="backtop-wrap">
      <button id="backtop" title="返回顶部" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- 右栏：动态详情 + 评论（默认显示占位） -->
  <aside class="col" id="detail-col">
    <div id="detail-topbar">
      <button id="detail-close" title="关闭">×</button>
    </div>
    <div id="detail-content"></div>
  </aside>
</div>

<!-- 图片灯箱预览 -->
<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-mask"></div>
  <button id="lightbox-close" title="关闭">×</button>
  <button id="lightbox-prev" title="上一张" hidden>‹</button>
  <button id="lightbox-next" title="下一张" hidden>›</button>
  <div id="lightbox-counter" hidden></div>
  <img id="lightbox-img" alt="预览">
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-mask" onclick="closeModal()"></div>
  <div class="modal-body">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="app.js?v=59"></script>
</body>
</html>
